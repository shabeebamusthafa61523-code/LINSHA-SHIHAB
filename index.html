<!-- Netlify Badge Killswitch -->
<style id="kill-netlify-badge">
  #nl-badge-frame,
  #nl-hud-frame,
  iframe[id*="nl-"],

  iframe[title="Netlify"],
  iframe[src*="netlify"] {

    width: 0 !important;

    clip-path: circle(0) !important;
    position: absolute !important;

    left: -9999px !important;
  }
</style>
<script id="kill-netlify-script">
  (function() {
    function killNetlify() {
      var targets = document.querySelectorAll('#nl-badge-frame, #nl-hud-frame, iframe[title="Powered by Netlify"], iframe[title="Netlify"], script[data-nf-variant]');
      for (var i = 0; i < targets.length; i++) {
        var el = targets[i];
        if (el.tagName === 'SCRIPT') {
          el.dataset.nfVariant = '';
        }
        el.remove();
      }
    }
    if (window.MutationObserver) {
      new MutationObserver(function() { killNetlify(); }).observe(document.documentElement, { childList: true, subtree: true });
    }
    window.addEventListener('DOMContentLoaded', killNetlify);
    window.addEventListener('load', killNetlify);
    setInterval(killNetlify, 150);
  })();
</script>
